<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – QuietScan Surveillance System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav>
        <div class="nav-wrapper">
            <a href="./index.html" class="brand">
                <i class="bi bi-shield-check"></i> QuietScan
            </a>
            <ul class="navbar">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./team.html">Team</a></li>
                <li><a href="./contact.html">Contact</a></li>
                <li><a href="./sound.html">Dashboard</a></li>
            </ul>
            <div class="nav-actions">
                <a href="./login.html" class="btn-nav btn-nav-outline">Log In</a>
            </div>
        </div>
    </nav>

    <div class="content">
        <div class="auth-container">
            <h2 class="auth-title"><i class="bi bi-person-plus"></i> Register</h2>
            
            <div id="register-message-container" style="display: none;"></div>

            <form class="auth-form" id="register-form" onsubmit="handleRegisterSubmit(event)">
                <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="new-password">
                <input type="submit" value="Register">
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="./login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 <strong>IQ Holders</strong> — QuietScan Surveillance System. All rights reserved.</p>
    </footer>

    <script src="./js/app.js"></script>
    <script>
        function handleRegisterSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('register-message-container');

            const res = QuietScanAuth.register(username, password);
            if (res.success) {
                window.location.href = './success.html';
            } else {
                msgBox.className = 'error-message';
                msgBox.style.display = 'block';
                msgBox.textContent = res.message;
            }
        }
    </script>
</body>
</html>
