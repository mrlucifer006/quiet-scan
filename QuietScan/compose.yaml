services:
  server:
    build:
      context: .
    ports:
      - "5000:5000"
    restart: unless-stopped
    # The following devices are required for hardware access (Microphone and Camera)
    # These paths (/dev/snd and /dev/video0) are standard on Linux.
    # If running on Windows with WSL2, ensure you have passed through the devices.
    devices:
      - "/dev/snd:/dev/snd"
      - "/dev/video0:/dev/video0"
    # Privileged mode helps with hardware access sometimes
    privileged: true
